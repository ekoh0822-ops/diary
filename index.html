<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>321 隨手日記</title>
  
  <!-- PWA & Apple Touch Icon (Base64 內嵌版，免外部圖片，徹底防牆破圖) -->
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUEngineAAAAEAAAABCAYAAAAfFcSJAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAB3RJTUUH6AIGEQ8nNfB2EAAAAB1pVFh0Q29tbWVudAAAAAAAQ3JlYXRlZCB3aXRoIEdJTVBkLm4DAAAAJUlEQVR42mNk+M9QzwADjAxgYmBgYGBgYGBgYGBgYGBgYGBgYGAGAAA3AAM4pZffAAAAAElFTkSuQmCC" />
  <link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUEngineAAAAEAAAABCAYAAAAfFcSJAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAB3RJTUUH6AIGEQ8nNfB2EAAAAB1pVFh0Q29tbWVudAAAAAAAQ3JlYXRlZCB3aXRoIEdJTVBkLm4DAAAAJUlEQVR42mNk+M9QzwADjAxgYmBgYGBgYGBgYGBgYGBgYGBgYGAGAAA3AAM4pZffAAAAAElFTkSuQmCC" />

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .date-display {
      font-size: 0.875rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .section-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .section-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      height: 80px;
      background-color: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      padding: 10px;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:active {
      opacity: 0.8;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #0f172a;
    }

    .history-container {
      margin-top: 32px;
    }

    .history-item {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      border-left: 3px solid var(--accent);
    }

    .history-date {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .history-content {
      font-size: 0.9rem;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <header>
    <h1>✨ 321 感恩日記</h1>
    <div class="date-display" id="currentDate"></div>
  </header>

  <main>
    <!-- 3 件感謝的事 -->
    <div class="section-card">
      <div class="section-title">3 件值得感謝的事</div>
      <textarea id="input3" placeholder="1. &#10;2. &#10;3. "></textarea>
    </div>

    <!-- 2 件讓人放鬆的事 -->
    <div class="section-card">
      <div class="section-title">2 件小小的成就或放鬆時刻</div>
      <textarea id="input2" placeholder="1. &#10;2. "></textarea>
    </div>

    <!-- 1 個明天的小目標 -->
    <div class="section-card">
      <div class="section-title">1 個明天的小目標</div>
      <textarea id="input1" placeholder="1. "></textarea>
    </div>

    <div class="button-group">
      <button class="btn-primary" onclick="saveJournal()">儲存今日日記</button>
    </div>

    <!-- 歷史紀錄區域 -->
    <div class="history-container">
      <h2 style="font-size: 1.1rem; margin-bottom: 12px; color: var(--text-sub);">歷史紀錄</h2>
      <div id="historyList"></div>
    </div>
  </main>

  <script>
    const STORAGE_KEY = 'my_standalone_journal_321';

    // 初始化頁面日期
    document.getElementById('currentDate').textContent = new Date().toLocaleDateString('zh-TW', {
      year: 'numeric',
      month: 'long',
      day: 'numeric',
      weekday: 'long'
    });

    // 載入歷史紀錄
    function loadHistory() {
      const historyList = document.getElementById('historyList');
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      
      if (data.length === 0) {
        historyList.innerHTML = '<div style="color: var(--text-sub); font-size: 0.85rem;">尚無紀錄，寫下今天的第一篇吧！</div>';
        return;
      }

      historyList.innerHTML = data.map(item => `
        <div class="history-item">
          <div class="history-date">${item.date}</div>
          <div class="history-content"><strong>【感謝】</strong>&#10;${item.p3}&#10;&#10;<strong>【放鬆】</strong>&#10;${item.p2}&#10;&#10;<strong>【目標】</strong>&#10;${item.p1}</div>
        </div>
      `).join('');
    }

    // 儲存日記（保持 key 一致，舊資料絕對不丟失）
    function saveJournal() {
      const p3 = document.getElementById('input3').value.trim();
      const p2 = document.getElementById('input2').value.trim();
      const p1 = document.getElementById('input1').value.trim();

      if (!p3 && !p2 && !p1) {
        alert('請至少填寫一個項目再儲存喔！');
        return;
      }

      const newEntry = {
        id: Date.now(),
        date: new Date().toLocaleString('zh-TW'),
        p3, p2, p1
      };

      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      data.unshift(newEntry);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

      // 清空輸入框並刷新列表
      document.getElementById('input3').value = '';
      document.getElementById('input2').value = '';
      document.getElementById('input1').value = '';
      loadHistory();
      alert('已成功儲存！');
    }

    // 初始化載入
    loadHistory();

    // -------------------------------------------------------------
    // PWA Service Worker 離線快取（確保不需外部請求，完全離線可用）
    // -------------------------------------------------------------
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'journal-core-v1';
        self.addEventListener('install', (e) => {
          e.waitUntil(
            caches.open(CACHE_NAME).then((cache) => cache.addAll(['./', './index.html']))
          );
        });
        self.addEventListener('fetch', (e) => {
          e.respondWith(
            caches.match(e.request).then((res) => res || fetch(e.request))
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }
  </script>
</body>
</html>
