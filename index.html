<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>321 日記單機版 ☃︎</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☃︎</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☃︎</text></svg>">
  <style>
    :root {
      --bg-color: #f7f8fa;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-sub: #7f8c8d;
      --accent: #3498db;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 20px 15px;
      max-width: 680px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-main);
    }

    .editor-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }
    .date-picker {
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 12px;
      color: var(--text-main);
      background: var(--bg-color);
    }

    /* 固定尺寸 4-7-8 呼吸圓形按鈕 */
    .breath-container {
      display: flex;
      justify-content: center;
      margin: 10px 0 16px 0;
    }
    .breath-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
      color: #2c3e50;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(161, 196, 253, 0.4);
      transition: background 1s ease, box-shadow 1s ease;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .breath-btn.inhale {
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      box-shadow: 0 0 30px #66a6ff;
      color: #fff;
    }
    .breath-btn.hold {
      background: linear-gradient(135deg, #a8edd9, #fed6e3);
      box-shadow: 0 0 20px #a8edd9;
      color: #2c3e50;
    }
    .breath-btn.exhale {
      background: linear-gradient(135deg, #c2e9fb, #a1c4fd);
      box-shadow: 0 0 10px rgba(161, 196, 253, 0.2);
      color: #2c3e50;
    }

    textarea {
      width: 100%;
      height: 140px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      outline: none;
      resize: vertical;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-main);
      font-family: inherit;
    }
    .btn-group {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }
    button.save-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button.save-btn:hover { opacity: 0.9; }

    .entry-list { display: flex; flex-direction: column; gap: 12px; }
    .entry-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 14px 16px;
      border: 1px solid var(--border-color);
      position: relative;
    }
    .entry-date {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .entry-content {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.95rem;
    }
    .delete-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: transparent;
      border: none;
      color: #e74c3c;
      padding: 2px 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .empty-tip {
      text-align: center;
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <header>
    <h1>321 日記單機版 ☃︎</h1>
  </header>

  <div class="editor-card">
    <input type="date" id="entryDate" class="date-picker">
    
    <!-- 固定尺寸的 4-7-8 呼吸圓形按鈕 -->
    <div class="breath-container">
      <button id="breathBtn" class="breath-btn" onclick="toggleBreath()">4-7-8 呼吸</button>
    </div>

    <textarea id="entryContent" placeholder="今天想記錄些什麼呢..."></textarea>
    <div class="btn-group">
      <button class="save-btn" onclick="saveEntry()">儲存日記</button>
    </div>
  </div>

  <div id="entryList" class="entry-list"></div>

  <script>
    // 初始化日期為今天
    document.getElementById('entryDate').valueAsDate = new Date();

    // 4-7-8 呼吸計時器邏輯
    let breathTimer = null;
    let isBreathing = false;

    function toggleBreath() {
      const btn = document.getElementById('breathBtn');
      if (isBreathing) {
        clearTimeout(breathTimer);
        isBreathing = false;
        btn.className = 'breath-btn';
        btn.innerText = '4-7-8 呼吸';
        return;
      }
      isBreathing = true;
      runBreathCycle();
    }

    function runBreathCycle() {
      const btn = document.getElementById('breathBtn');
      if (!isBreathing) return;

      // 1. 吸氣 4 秒
      btn.className = 'breath-btn inhale';
      btn.innerText = '吸氣...\n(4)';
      
      breathTimer = setTimeout(() => {
        if (!isBreathing) return;
        // 2. 屏息 7 秒
        btn.className = 'breath-btn hold';
        btn.innerText = '屏息...\n(7)';
        
        breathTimer = setTimeout(() => {
          if (!isBreathing) return;
          // 3. 呼氣 8 秒
          btn.className = 'breath-btn exhale';
          btn.innerText = '呼氣...\n(8)';
          
          breathTimer = setTimeout(() => {
            if (isBreathing) runBreathCycle();
          }, 8000);
        }, 7000);
      }, 4000);
    }

    // 從 LocalStorage 載入日記
    function loadEntries() {
      const data = localStorage.getItem('my_standalone_journal');
      return data ? JSON.parse(data) : [];
    }

    // 渲染日記列表
    function renderEntries() {
      const entries = loadEntries();
      const container = document.getElementById('entryList');
      
      if (entries.length === 0) {
        container.innerHTML = '<div class="empty-tip">目前還沒有日記，寫下第一篇吧！</div>';
        return;
      }

      entries.sort((a, b) => new Date(b.date) - new Date(a.date));

      container.innerHTML = entries.map((item) => `
        <div class="entry-card">
          <div class="entry-date">${item.date}</div>
          <div class="entry-content">${escapeHtml(item.text)}</div>
          <button class="delete-btn" onclick="deleteEntry('${item.id}')">刪除</button>
        </div>
      `).join('');
    }

    // 儲存日記
    function saveEntry() {
      const date = document.getElementById('entryDate').value;
      const text = document.getElementById('entryContent').value.trim();

      if (!date || !text) {
        alert('請填寫日期與內容！');
        return;
      }

      const entries = loadEntries();
      const newEntry = {
        id: Date.now().toString(),
        date: date,
        text: text
      };

      entries.push(newEntry);
      localStorage.setItem('my_standalone_journal', JSON.stringify(entries));

      document.getElementById('entryContent').value = '';
      renderEntries();
    }

    // 刪除日記
    function deleteEntry(id) {
      if (!confirm('確定要刪除這篇日記嗎？')) return;
      let entries = loadEntries();
      entries = entries.filter(e => e.id !== id);
      localStorage.setItem('my_standalone_journal', JSON.stringify(entries));
      renderEntries();
    }

    // 安全轉義
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    // 頁面初始化
    renderEntries();
  </script>
</body>
</html>
