<!DOCTYPE1 html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4-7-8 呼吸練習</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --circle-color: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
    }

    /* 呼吸器主要容器 */
    .breather-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* 圓形按鈕主體 */
    .breath-circle {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.2) 0%, rgba(56, 189, 248, 0.05) 70%);
      border: 2px solid var(--circle-color);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.3s ease-out, box-shadow 0.3s ease-out;
    }

    /* 圓圈內文字樣式 */
    .breath-action {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .breath-timer {
      font-size: 2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* 圓圈外的 1 行微型提示 */
    .breath-tips {
      font-size: 0.8rem;
      color: var(--text-sub);
      letter-spacing: 0.5px;
      opacity: 0.8;
      text-align: center;
      max-width: 280px;
      line-height: 1.4;
    }

    /* 動畫狀態類別 (由 JS 動態切換 transition 時間) */
    .breath-circle.inhale {
      transform: scale(1.35);
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.5);
      transition: transform 4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 4s ease-in-out;
    }

    .breath-circle.hold {
      transform: scale(1.35);
      box-shadow: 0 0 40px rgba(251, 191, 36, 0.5);
      border-color: #fbbf24;
      transition: box-shadow 0.5s ease-in-out, border-color 0.5s ease-in-out;
    }

    .breath-circle.exhale {
      transform: scale(1);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.1);
      border-color: var(--circle-color);
      transition: transform 8s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 8s ease-in-out;
    }
  </style>
</head>
<body>

  <div class="breather-container">
    <!-- 1. 極簡圓圈按鈕 -->
    <div class="breath-circle" id="breathCircle" onclick="toggleBreathing()">
      <div class="breath-action" id="breathAction">開始</div>
      <div class="breath-timer" id="breathTimer">4-7-8</div>
    </div>

    <!-- 2. 圓圈下方微型姿勢提示 -->
    <div class="breath-tips">
      💡 提示：舌尖輕抵上門牙後方，鼻吸嘴吐，放鬆雙肩。
    </div>
  </div>

  <script>
    let isRunning = false;
    let timerId = null;

    const circle = document.getElementById('breathCircle');
    const actionText = document.getElementById('breathAction');
    const timerText = document.getElementById('breathTimer');

    function toggleBreathing() {
      if (isRunning) {
        stopBreathing();
      } else {
        startBreathing();
      }
    }

    function stopBreathing() {
      isRunning = false;
      clearTimeout(timerId);
      circle.className = 'breath-circle';
      actionText.textContent = '開始';
      timerText.textContent = '4-7-8';
    }

    function startBreathing() {
      isRunning = true;
      runCycle();
    }

    function runCycle() {
      if (!isRunning) return;

      // 1. 吸氣 4 秒
      circle.className = 'breath-circle inhale';
      actionText.textContent = '吸氣';
      countDown(4, () => {
        if (!isRunning) return;

        // 2. 憋氣 7 秒
        circle.className = 'breath-circle hold';
        actionText.textContent = '憋氣';
        countDown(7, () => {
          if (!isRunning) return;

          // 3. 吐氣 8 秒
          circle.className = 'breath-circle exhale';
          actionText.textContent = '吐氣';
          countDown(8, () => {
            if (!isRunning) return;
            // 循環執行
            runCycle();
          });
        });
      });
    }

    function countDown(seconds, onComplete) {
      timerText.textContent = seconds;
      let left = seconds;
      
      const interval = setInterval(() => {
        if (!isRunning) {
          clearInterval(interval);
          return;
        }
        left--;
        if (left > 0) {
          timerText.textContent = left;
        } else {
          clearInterval(interval);
          onComplete();
        }
      }, 1000);
    }
  </script>
</body>
</html>
